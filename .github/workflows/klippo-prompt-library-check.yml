name: Klippo prompt library checks

on:
  push:
    branches:
      - "staging/**"
  pull_request:
    branches:
      - main
    paths:
      - "bot.py"
      - "prompt_catalog.py"
      - "prompt_engine.py"
      - "prompts/prompt_library.json"
      - ".github/workflows/klippo-prompt-library-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile bot.py prompt_catalog.py prompt_engine.py
      - name: Validate prompt library structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("prompts/prompt_library.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          categories = data.get("categories", [])
          prompts = data.get("prompts", [])
          assert categories, "No categories found"
          assert prompts, "No prompts found"
          category_ids_present = {item.get("id") for item in categories}
          required_new_categories = {
              "travel", "pets", "automotive", "garden",
              "kitchen", "furniture", "baby", "crafts",
          }
          assert required_new_categories <= category_ids_present, (
              f"New product categories missing: {required_new_categories - category_ids_present}"
          )
          assert data.get("storyboard_spec", {}).get("copy_ready_output"), (
              "Copy-ready output rule missing from library metadata"
          )

          prompt_ids = [item.get("id") for item in prompts]
          assert all(prompt_ids), "A prompt is missing its id"
          assert len(prompt_ids) == len(set(prompt_ids)), "Duplicate prompt ids found"
          by_id = {item["id"]: item for item in prompts}

          category_ids = [item.get("id") for item in categories]
          assert len(category_ids) == len(set(category_ids)), "Duplicate category ids found"
          for category in categories:
              assert category.get("label"), f"Category missing label: {category}"
              for prompt_id in category.get("prompt_ids", []):
                  assert prompt_id in by_id, f"Missing prompt referenced by {category['id']}: {prompt_id}"
                  assert by_id[prompt_id].get("category") == category["id"], (
                      f"Category mismatch for prompt {prompt_id}"
                  )

          for prompt in prompts:
              assert prompt.get("label") and prompt.get("prompt"), (
                  f"Prompt missing label/text: {prompt.get('id')}"
              )
              text = prompt["prompt"].casefold()
              for required in (
                  "reference lock:", "master visual reference", "strict output rules:", "no on-screen text",
                  "logos", "exactly 10 seconds", "vertical 9:16"
              ):
                  assert required in text, (
                      f"Prompt {prompt['id']} is missing required reference/output rule: {required}"
                  )
          # Reference-lock and category-fit regression checks across the complete library.
          for prompt in prompts:
              body = prompt["prompt"].casefold()
              assert "no uploaded image" not in body and "text only" not in body, (
                  f"Prompt {prompt['id']} contradicts the image-to-video workflow"
              )
              assert "uploaded image" in body and "sole source of truth" in body, (
                  f"Prompt {prompt['id']} lacks an explicit reference-image lock"
              )
              for shot in prompt["storyboard"]:
                  assert shot["direction"] in prompt["prompt"], (
                      f"Storyboard/prompt mismatch for {prompt['id']} / {shot['time']}"
                  )
          by_id_for_quality = {p["id"]: p for p in prompts}
          assert "study-desk" not in by_id_for_quality["beauty_cleanser_rich_lather_v1"]["storyboard"][0]["direction"].casefold()
          assert "study-desk" not in by_id_for_quality["shoes_lace_and_step_v1"]["storyboard"][0]["direction"].casefold()
          assert "footwear" not in by_id_for_quality["beauty_vanity_hero_v1"]["storyboard"][0]["direction"].casefold()
          assert "food or drink" not in by_id_for_quality["beauty_texture_demo_v1"]["storyboard"][0]["direction"].casefold()
          assert "footwear" not in by_id_for_quality["bags_sling_crossbody_v1"]["storyboard"][0]["direction"].casefold()
          assert "outsole" not in by_id_for_quality["bags_sling_crossbody_v1"]["storyboard"][2]["direction"].casefold()
          assert "named bag or wallet" not in by_id_for_quality["fashion_sit_stand_transition_v1"]["storyboard"][0]["direction"].casefold()
          assert "named bag or wallet" not in by_id_for_quality["accessories_tabletop_macro_v1"]["storyboard"][0]["direction"].casefold()
          assert "footwear" not in by_id_for_quality["accessories_necklace_drape_v1"]["storyboard"][0]["direction"].casefold()
          assert "lace, heel" not in by_id_for_quality["accessories_wrist_lifestyle_v1"]["storyboard"][2]["direction"].casefold()
          assert "visible stitching, closure, strap" not in by_id_for_quality["wallets_everyday_carry_v1"]["storyboard"][2]["direction"].casefold()

          # Every curated entry must carry its own timed premium storyboard.
          storyboard_signatures = set()
          for prompt in prompts:
              storyboard = prompt.get("storyboard", [])
              assert len(storyboard) == 4, (
                  f"Prompt {prompt['id']} must have four timed storyboard shots"
              )
              expected_times = ["0–2s", "2–6s", "6–8s", "8–10s"]
              actual_times = [shot.get("time") for shot in storyboard]
              assert actual_times == expected_times, (
                  f"Prompt {prompt['id']} has invalid storyboard timing: {actual_times}"
              )
              assert all(shot.get("shot") and shot.get("direction") for shot in storyboard), (
                  f"Prompt {prompt['id']} has an incomplete storyboard"
              )
              assert "PREMIUM STORYBOARD — EXACTLY 10 SECONDS:" in prompt["prompt"], (
                  f"Prompt {prompt['id']} is missing its embedded storyboard"
              )
              assert "CINEMATOGRAPHY & CONTINUITY:" in prompt["prompt"], (
                  f"Prompt {prompt['id']} is missing premium continuity direction"
              )
              storyboard_signatures.add("|".join(shot["direction"] for shot in storyboard))
          assert len(storyboard_signatures) == len(prompts), (
              "Every prompt must have a unique product-specific storyboard"
          )

          bot = Path("bot.py").read_text(encoding="utf-8")
          required_flow_markers = [
              "if context.user_data.get('stage') == 'prompt_upload':",
              "elif action == 'prompt_categories':",
              "elif action.startswith('pcat:')",
              "elif action.startswith('ptpl:')",
              "PROMPT_LIBRARY_PATH",
              "prompt_category_menu()",
              "prompt_options_menu(category_id)",
              "context.user_data['prompt_library_storyboard'] = template.get('storyboard', [])",
              "storyboard_override=context.user_data.get('prompt_library_storyboard') or None",
              "prompt_categories|pcat:[a-z0-9_]+|ptpl:[a-z0-9_]+",
            "async def handle_image_or_receipt_document(",
            "filters.Document.IMAGE | filters.Document.MimeType('application/pdf'), handle_image_or_receipt_document",
          ]
          missing = [marker for marker in required_flow_markers if marker not in bot]
          assert not missing, f"Prompt-library flow markers missing from bot.py: {missing}"

          # Check the actual PROMPT IMAGE builder, not only the video library.
          image_start = bot.find("image_prompt = (")
          image_end = bot.find("context.user_data['prompt_image_ready']", image_start)
          assert image_start >= 0 and image_end > image_start, "PROMPT IMAGE builder missing"
          image_source = bot[image_start:image_end]
          assert r"\\n" not in image_source, "PROMPT IMAGE contains literal escaped newline sequences"
          for category_id in category_ids:
              assert f"'{category_id}':" in image_source, (
                  f"PROMPT IMAGE lacks category-specific visual direction: {category_id}"
              )
          assert "sole MASTER product reference" in image_source
          assert "No collage, split screen, poster layout, captions, promotional text" in image_source

          # Exercise prompt generation for every library entry, with and without user details.
          # Keep this in sync with inject_product_details() and Telegram's ordered chunking.
          def inject_details(prompt_text, details):
              details = " ".join((details or "").split()).strip()
              if not details:
                  return prompt_text
              note = (
                  "PRODUCT NAME / DETAILS FROM USER: " + details +
                  ". The uploaded image is the master visual reference; these details are supplementary and must not override it. "
                  "\\n\\n"
              )
              first_sentence_end = prompt_text.find(". ")
              if first_sentence_end >= 0:
                  return prompt_text[:first_sentence_end + 2] + note + prompt_text[first_sentence_end + 2:]
              return note + prompt_text

          generated_cases = 0
          for prompt in prompts:
              for details in ("", "Example product name; do not assume unprovided features"):
                  generated = "PROMPT VIDEO — 10 SAAT\\n\\n" + inject_details(prompt["prompt"], details)
                  assert generated.startswith("PROMPT VIDEO — 10 SAAT\\n\\n")
                  assert "STRICT OUTPUT RULES:" in generated
                  assert "Keep the product presentation consistent" in generated
                  assert "master visual reference" in generated.casefold()
                  assert "no uploaded image" not in generated
                  chunks = [generated[index:index + 3800] for index in range(0, len(generated), 3800)] or [generated]
                  assert "".join(chunks) == generated, f"Prompt was truncated: {prompt['id']}"
                  assert all(len(chunk) <= 3800 for chunk in chunks), f"Unsafe chunk length: {prompt['id']}"
                  if details:
                      assert "PRODUCT NAME / DETAILS FROM USER:" in generated
                      assert "details are supplementary and must not override it" in generated
                  generated_cases += 1

          # Regression checks for the reusable White Doodle storyboard style.
          import os
          import sqlite3
          import tempfile

          with tempfile.TemporaryDirectory() as tmp:
              os.environ["KLIPPO_PROMPT_DB"] = str(Path(tmp) / "prompt_catalog.sqlite3")
              from prompt_catalog import choices, resolve, DB_PATH
              from prompt_engine import build_prompt

              # Verify the selected GitHub storyboard is used by the actual final prompt.
              curated = next(item for item in prompts if item.get("storyboard"))
              curated_prompt = build_prompt(
                  "storyboard",
                  "NAMA_PRODUK: Example beauty product",
                  "premium clean studio",
                  "push",
                  "cinematic",
                  10,
                  "Test curated storyboard",
                  product_type="beauty",
                  storyboard_override=curated["storyboard"],
              )
              assert curated_prompt.startswith("PROMPT VIDEO — 10 SAAT")
              assert "DIRECTOR'S CURATED PREMIUM STORYBOARD" in curated_prompt
              assert "NO ON-SCREEN TEXT" in curated_prompt
              for shot in curated["storyboard"]:
                  assert shot["direction"] in curated_prompt, (
                      f"Selected storyboard shot was not used: {curated['id']} / {shot['time']}"
                  )
              assert "ON-SCREEN HOOK: Display EXACTLY" not in curated_prompt

              # Exercise every curated storyboard through the actual two-part 20s builder.
              for prompt_entry in prompts:
                  paired_entry = build_prompt(
                      "storyboard",
                      "NAMA_PRODUK: Example " + prompt_entry["category"],
                      "clean premium studio background",
                      "push",
                      "cinematic",
                      20,
                      product_type="other",
                      storyboard_override=prompt_entry["storyboard"],
                  )
                  assert paired_entry.count("PROMPT VIDEO — 10 SAAT") == 2, prompt_entry["id"]
                  assert "=== KLIPPO PART 2 ===" in paired_entry, prompt_entry["id"]
                  assert "CONTINUITY BRIDGE" in paired_entry, prompt_entry["id"]
                  assert "CONTINUATION ACTION" in paired_entry, prompt_entry["id"]
                  assert "NO ON-SCREEN TEXT" in paired_entry, prompt_entry["id"]
                  assert "MASTER visual reference" in paired_entry, prompt_entry["id"]
                  assert "ON-SCREEN HOOK: Display EXACTLY" not in paired_entry, prompt_entry["id"]

              paired_curated = build_prompt(
                  "storyboard",
                  "NAMA_PRODUK: Example beauty product",
                  "premium clean studio",
                  "push",
                  "cinematic",
                  20,
                  "Test curated storyboard",
                  product_type="beauty",
                  storyboard_override=curated["storyboard"],
              )
              assert "=== KLIPPO PART 2 ===" in paired_curated
              assert "CONTINUITY BRIDGE" in paired_curated
              assert "CONTINUATION ACTION" in paired_curated
              assert "Do not repeat the opening hook" in paired_curated
              assert "\\n\\n" not in curated_prompt, (
                  "Generated prompt contains literal escaped newlines instead of copy-ready formatting"
              )

              assert ("white_doodle", "✏️ White Doodle") in choices()
              style_key, style_name, style_template = resolve("white_doodle")
              assert style_key == "white_doodle"
              for required in (
                  "verified", "omit unsupported labels", "never render words", "HOLD the final frame",
                  "Do not draw the main surrounding contour in Part 1",
                  "white dashed contour", "Never invent unseen sides"
              ):
                  assert required.casefold() in style_template.casefold(), (
                      f"White Doodle template missing rule: {required}"
                  )

              with sqlite3.connect(DB_PATH) as db:
                  version = db.execute(
                      "SELECT version FROM storyboard_prompt_styles WHERE style_key='white_doodle'"
                  ).fetchone()[0]
                  assert version == 5, f"Unexpected White Doodle template version: {version}"

              uncertain = (
                  "PRODUCT NAME: unknown. "
                  "Optional user details: "
              )
              first = build_prompt(
                  "storyboard", uncertain, "clean premium studio background",
                  "push", "white_doodle", 10
              )
              assert "NO ON-SCREEN HOOK TEXT" in first
              assert "Do not perform the main surrounding contour yet." in first
              assert "HOLD the final frame" in first
              assert "Never guess a category, benefit, price, popularity or product name." in first

              verified = "NAMA_PRODUK: Beg VELLA"
              verified_prompt = build_prompt(
                  "storyboard", verified, "clean premium studio background",
                  "push", "white_doodle", 10
              )
              assert "NO ON-SCREEN HOOK TEXT" in verified_prompt
              assert "KENALI Beg VELLA" not in verified_prompt, (
                  "Product names must not be rendered as on-screen text"
              )

              generic_prompt = build_prompt(
                  "video", verified, "clean premium studio background",
                  "push", "cinematic", 10
              )
              assert "NO ON-SCREEN TEXT" in generic_prompt
              assert "Only show a product name or exact wording" not in generic_prompt

              paired = build_prompt(
                  "storyboard", uncertain, "clean premium studio background",
                  "push", "white_doodle", 20
              )
              assert "=== KLIPPO PART 2 ===" in paired
              first_part, second_part = paired.split("=== KLIPPO PART 2 ===", 1)
              assert "HOLD the final frame" in first_part
              assert "SECOND CLIP 10s" in second_part and "full-product frame" in second_part
              assert "Do NOT repeat the opening hook" in second_part

          print(
              f"Validated {len(categories)} categories, {len(prompts)} prompt-library entries, "
              f"{generated_cases} generated library cases, flow markers, and White Doodle v4 "
              "evidence/continuity behavior."
          )
          PY
