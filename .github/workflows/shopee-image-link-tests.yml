name: Shopee image-link tests

on:
  pull_request:
    branches: [main]
    paths:
      - "bot.py"
      - "tests/test_shopee_image_link.py"
      - "tests/test_shopee_live.py"
      - "tests/diagnose_shopee_browser.py"
      - ".github/workflows/shopee-image-link-tests.yml"
  push:
    branches: ["fix/shopee-image-link-only"]
    paths:
      - "bot.py"
      - "tests/test_shopee_image_link.py"
      - "tests/test_shopee_live.py"
      - "tests/diagnose_shopee_browser.py"
      - ".github/workflows/shopee-image-link-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "Pillow>=10.4,<12" "playwright>=1.50,<2"
      - name: Install Chromium for browser-rendered diagnostic
        run: python -m playwright install --with-deps chromium
      - name: Compile bot
        run: python -m py_compile bot.py
      - name: Test Shopee URL and image extraction
        run: python -m unittest discover -s tests -p "test_shopee_image_link.py" -v
      - name: Diagnose images rendered by Shopee in Chromium
        run: python tests/diagnose_shopee_browser.py
      - name: Live test the supplied Shopee links
        run: python -m unittest discover -s tests -p "test_shopee_live.py" -v
