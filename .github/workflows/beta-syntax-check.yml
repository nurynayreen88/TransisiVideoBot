name: Beta syntax check

on:
  push:
    branches:
      - test/fal-storyboard-beta
  pull_request:
    branches:
      - test/fal-storyboard-beta

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install beta dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all prompt and beta Python files
        run: |
          python -m py_compile bot.py prompt_catalog.py prompt_engine.py fal_storyboard_test.py fal_storyboard_test_bot.py modules/video_engine.py modules/storyboard_engine.py modules/product_video_prompt.py tests/test_fal_storyboard_helpers.py tests/test_product_video_prompt.py tests/test_storyboard_engine.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
