name: Beta syntax check

on:
  push:
    branches:
      - test/fal-storyboard-beta
  pull_request:
    branches:
      - test/fal-storyboard-beta

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile beta Python files
        run: |
          python -m py_compile fal_storyboard_test.py fal_storyboard_test_bot.py modules/video_engine.py
