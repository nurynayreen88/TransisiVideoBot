name: Klippo creative audit
on:
  push:
    branches:
      - quality/klippo-creative-upgrade-20261024
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_klippo_creative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klippo-creative-audit
          path: klippo_creative_audit_report.json
