name: Prompt quality regression tests

on:
  pull_request:
    paths:
      - "bot.py"
      - "prompt_engine.py"
      - "prompt_catalog.py"
      - "prompts/prompt_library.json"
      - "prompts/prompt_quality_overrides.json"
      - "prompts/prompt_component_tables.json"
      - "prompts/universal_prompt_templates.json"
      - "tests/test_prompt_quality.py"
      - "tests/test_prompt_component_tables.py"
      - ".github/workflows/prompt-quality.yml"
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "prompt_engine.py"
      - "prompt_catalog.py"
      - "prompts/prompt_library.json"
      - "prompts/prompt_quality_overrides.json"
      - "prompts/prompt_component_tables.json"
      - "prompts/universal_prompt_templates.json"
      - "tests/test_prompt_quality.py"
      - "tests/test_prompt_component_tables.py"
      - ".github/workflows/prompt-quality.yml"

jobs:
  prompt-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run prompt quality regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
